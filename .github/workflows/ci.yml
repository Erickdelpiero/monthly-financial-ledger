name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:        # so deploy.yml can gate on this exact job

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      # Point the suite at a dedicated NON-superuser role that OWNS
      # money_ledger_test -- the same least-privilege setup the VPS and the
      # local pgserver flow use, so `test_role_privileges` is actually
      # exercised. The password here is irrelevant: the service container runs
      # trust auth (below), matching local dev, which is also what lets
      # `test_upgrade_tolerates_percent_in_the_db_url` connect with its
      # deliberately-malformed '%' password.
      TEST_DATABASE_URL: postgresql+psycopg://money_ledger_app:change-me-locally@localhost:5432/money_ledger_test
    services:
      postgres:
        image: postgres:16
        env:
          # Trust auth for host connections = same model as the local pgserver
          # socket. No POSTGRES_USER/DB: keep the image's default `postgres`
          # superuser only for the one-off provisioning step.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Provision the least-privilege test role + DB
        # Reuses scripts/local_db_setup.sql verbatim: creates money_ledger_app
        # (NOSUPERUSER / NOCREATEDB / NOCREATEROLE / NOREPLICATION / NOBYPASSRLS)
        # plus money_ledger_dev + money_ledger_test owned by it. Run as the
        # container's default `postgres` superuser (trust auth, no password).
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client; }
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres \
            -f scripts/local_db_setup.sql

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Light checks (compile + import graph)
        run: |
          python -m compileall -q src tests migrations
          python -c "import money_ledger.api.routes"
          python -c "import money_ledger.reports.render"   # matplotlib import path

      - name: Tests (-W error, twice)
        run: |
          python -m pytest -q -W error -m "not docker"
          python -m pytest -q -W error -m "not docker"
