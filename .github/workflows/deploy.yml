name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write        # push the image to GHCR

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production      # <-- required-reviewer gate (approve every deploy)
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase image repo (GHCR requires it)
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `docker-container` driver -- the default `docker` driver on the runner
      # cannot export a build cache (`type=gha` below).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The deploy key on the VPS is locked to a forced command
      # (authorized_keys `command="sudo /usr/local/sbin/mfl-deploy-run.sh"`),
      # so this `script` is not run as a shell -- it only becomes the wrapper's
      # $SSH_ORIGINAL_COMMAND. All git / pull / compose logic lives in
      # deploy/mfl-deploy-run.sh on the VPS (see docs/block-8-cicd-deploy.md
      # Part 3). `mfl-deploy` is not in the `docker` group.
      - name: Deploy over SSH (forced-command wrapper on the VPS)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: deploy ${{ github.sha }}
