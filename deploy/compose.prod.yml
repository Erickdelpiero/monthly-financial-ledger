# PRODUCTION deploy for the ledger API (Block 8; PHASE-2.7 §3-9 / §23-28).
#
# Run by the dedicated deploy user on the VPS, driven by .github/workflows/deploy.yml
# through deploy/mfl-deploy-run.sh. It replaces the hand-rolled `docker run` from
# docs/block-6-n8n-telegram.md Step 3.
#
# ASSUMES THE SYSTEM DOCKER DAEMON -- the one that runs gonex-postgres /
# gonex-n8n. `ledger-net` and the DB network are declared `external` and only
# resolve there. The deploy user's rootless daemon (if any) is a separate
# network namespace and cannot see them (B8-7).
#
#   cd ~/deploy/monthly-financial-ledger
#   IMAGE=ghcr.io/<owner>/<repo>:<sha> docker compose -f deploy/compose.prod.yml run --rm migrate
#   IMAGE=ghcr.io/<owner>/<repo>:<sha> docker compose -f deploy/compose.prod.yml up -d api
#
# Non-secret and secret values come from a sibling ./.env on the VPS (git-ignored,
# maintained by the operator -- NEVER committed). Compose reads ./.env from the
# directory you run it in, so run compose from ~/deploy/monthly-financial-ledger.
#
# Required in ./.env:
#   DB_NAME=personal_finance_bot
#   DB_USER=money_ledger_app            # least-privilege runtime role
#   DB_PASSWORD=...
#   MIGRATE_DB_USER=<schema owner>      # NOT money_ledger_app (see B6 ownership fix)
#   MIGRATE_DB_PASSWORD=...
#   API_INTERNAL_TOKEN=...              # a fresh strong value, NOT the DB password
# Optional in ./.env (defaults shown):
#   DB_HOST=gonex-postgres
#   DB_PORT=5432
#   LEDGER_DB_NETWORK=docker_gonex-network

name: money-ledger-prod

services:
  # One-shot: `alembic upgrade head` as the schema-owner role. Additive
  # migrations only reach here after CI is green (PHASE-2.7 §17 / §27); a
  # destructive migration still needs explicit human approval and is not run
  # by this pipeline.
  migrate:
    image: ${IMAGE:?set IMAGE to the ghcr.io tag to deploy}
    command: ["alembic", "upgrade", "head"]
    environment:
      DB_HOST: ${DB_HOST:-gonex-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?}
      DB_USER: ${MIGRATE_DB_USER:?schema-owner role, not the app role}
      DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?}
    networks: [ledger-db-net]
    restart: "no"

  api:
    image: ${IMAGE:?set IMAGE to the ghcr.io tag to deploy}
    container_name: ledger-api          # n8n reaches it as http://ledger-api:8000
    environment:
      DB_HOST: ${DB_HOST:-gonex-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?}
      DB_USER: ${DB_USER:?least-privilege app role}
      DB_PASSWORD: ${DB_PASSWORD:?}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?}
      ENVIRONMENT: production
    networks: [ledger-net, ledger-db-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Both pre-exist on the VPS (created during Block 6). `ledger-net` joins n8n;
  # `ledger-db-net` is whatever network reaches gonex-postgres.
  ledger-net:
    external: true
    name: ledger-net
  ledger-db-net:
    external: true
    name: ${LEDGER_DB_NETWORK:-docker_gonex-network}
