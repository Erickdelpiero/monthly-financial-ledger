# LOCAL development stack (PHASE-2.7 §5-9). Production uses the existing
# `gonex-postgres` and a separate deploy path (Block 8), not this file.
#
#   docker compose up --build       # db -> migrate (one-shot) -> api
#
# Host ports are bound to loopback only; nothing is exposed to the internet
# (PHASE-2.11 §5). Needs POSTGRES_PASSWORD and API_INTERNAL_TOKEN in .env.

name: money-ledger

# DB connection is passed to the app as COMPONENTS, never a hand-built URL
# string -- Python assembles it with sqlalchemy.URL.create, which percent-encodes
# the password, so `@ : / # %` in POSTGRES_PASSWORD are safe.
x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-money_ledger}
  DB_USER: ${POSTGRES_USER:-money_ledger_app}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-money_ledger_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-money_ledger}
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-money_ledger_app} -d ${POSTGRES_DB:-money_ledger}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ledger-net]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [ledger-net]

  api:
    build: .
    environment:
      <<: *db-env
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?set API_INTERNAL_TOKEN in .env}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [ledger-net]

volumes:
  ledger-pgdata:

networks:
  ledger-net:
    driver: bridge
